services:
  cratescan:
    build: .
    ports:
      - "5178:5178"
    environment:
      - PORT=5178
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
      - YTDLP_COOKIES_FROM_BROWSER=${YTDLP_COOKIES_FROM_BROWSER:-}
    volumes:
      - spectrograms:/app/public/spectrograms
      - ${YTDLP_COOKIES_HOST_PATH:-/dev/null}:/app/cookies.txt:ro

volumes:
  spectrograms:
